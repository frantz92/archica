version: 2
updates:
  # Application dependencies. One grouped pull request a week keeps the review small; every PR
  # runs the whole quality gate, so a breaking update shows up red instead of in production.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Warsaw
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
    # Major bumps of the toolchain are done by hand, together with the packages that must follow
    # (eslint-config-next / typescript-eslint for ESLint and TypeScript; @types/node tracks the
    # Node version we deploy on, currently 22).
    ignore:
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      - dependency-name: eslint
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      production:
        dependency-type: production
      development:
        dependency-type: development
        update-types: [minor, patch]

  # Versions of the actions used in .github/workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Warsaw
    commit-message:
      prefix: 'chore(ci)'
    groups:
      actions:
        patterns: ['*']
